<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="GCC Resume Builder — Free ATS CV Maker for Gulf Jobs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="paperShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative paper preview -->
  <g transform="translate(720,90)" opacity="0.95">
    <rect width="380" height="490" rx="10" fill="url(#paperShadow)"/>
    <rect x="24" y="32" width="180" height="14" rx="3" fill="#1e3a8a"/>
    <rect x="24" y="56" width="120" height="9" rx="2" fill="#64748b"/>
    <rect x="24" y="92" width="332" height="2" fill="#cbd5e1"/>
    <rect x="24" y="110" width="100" height="10" rx="2" fill="#1e3a8a"/>
    <rect x="24" y="130" width="332" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="24" y="142" width="280" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="24" y="154" width="310" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="24" y="190" width="100" height="10" rx="2" fill="#1e3a8a"/>
    <rect x="24" y="210" width="332" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="24" y="222" width="290" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="24" y="234" width="320" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="24" y="270" width="100" height="10" rx="2" fill="#1e3a8a"/>
    <rect x="24" y="290" width="332" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="24" y="302" width="270" height="6" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(80,90)">
    <rect width="64" height="64" rx="14" fill="#ffffff"/>
    <text x="32" y="42" text-anchor="middle"
          font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#1e3a8a" letter-spacing="0.5">GCC</text>
  </g>

  <!-- Title -->
  <text x="80" y="240"
        font-family="Inter, system-ui, sans-serif"
        font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1">GCC Resume Builder</text>

  <!-- Subtitle -->
  <text x="80" y="306"
        font-family="Inter, system-ui, sans-serif"
        font-size="32" font-weight="500" fill="#dbeafe">Free ATS CV maker for Gulf jobs</text>

  <!-- Feature pills -->
  <g font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600">
    <g transform="translate(80,400)">
      <rect width="220" height="44" rx="22" fill="rgba(255,255,255,0.14)"/>
      <text x="110" y="29" text-anchor="middle" fill="#ffffff">50 templates</text>
    </g>
    <g transform="translate(316,400)">
      <rect width="220" height="44" rx="22" fill="rgba(255,255,255,0.14)"/>
      <text x="110" y="29" text-anchor="middle" fill="#ffffff">AI improvement</text>
    </g>
    <g transform="translate(552,400)">
      <rect width="155" height="44" rx="22" fill="rgba(255,255,255,0.14)"/>
      <text x="78" y="29" text-anchor="middle" fill="#ffffff">PDF + Word</text>
    </g>
  </g>

  <!-- Footer line -->
  <text x="80" y="540"
        font-family="Inter, system-ui, sans-serif"
        font-size="20" font-weight="500" fill="#94a3b8">Saudi Arabia · UAE · Qatar · Kuwait · Bahrain · Oman</text>
</svg>
